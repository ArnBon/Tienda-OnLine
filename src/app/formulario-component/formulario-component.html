<div class="container">

  <h5 class="text-success mt-3">Agregar Nuevo Producto</h5>

  <form class="d-flex justify-content-between align-items-center my-4 w-50 mx-auto">
    <input type="text" id="descripcion" name="descripcion" placeholder="Descripción Producto"
      class="form-control me-2 w-75" autocomplete="off" [(ngModel)]="descripcionInput" />


    <input type="number" d="precio" name="precio" placeholder="Precio" class="form-control me-2 w-25"
      [(ngModel)]="precioInput" />


  </form>

  <button type="submit" class="btn btn-primary" (click)="agregarProducto()">Agregar
  </button>
</div>
