<div class="container mt-4">
  <h3 class="text-warning">Listado de Productos</h3>
  <div>
    <button class="btn btn-primary my-5" (click)="agregarProducto()">+</button>
  </div>
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th scope="col">Descripción</th>
        <th scope="col">Precio</th>
        <th scope="col">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (llave of obtenerLlaves(); track llave) {
        @if(productos[llave]) {
          <tr app-producto-component [productoModel]="productos[llave]" [llave]="llave"></tr>
        }
      }
    </tbody>
  </table>
</div>
